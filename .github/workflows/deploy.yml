name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd Frontend
          npm ci

      - name: Inject API URL and build frontend
        run: |
          cd Frontend
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env.production
          npm run build

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "Frontend/dist/*"
          target: "/var/www/viwahaa-frontend-latest/"
          strip_components: 2

      - name: Deploy backend to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/viwahaa-latest

            # Pull latest code
            git pull origin main

            # Install backend dependencies
            npm ci --omit=dev

            # Apply any new Prisma migrations (skips already-applied ones)
            npx prisma migrate deploy 2>/dev/null || true

            # Restart or start backend with PM2
            pm2 restart viwahaa-latest-api || pm2 start npm --name "viwahaa-latest-api" -- start

            pm2 save
